name: Package candidates

on:
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
    paths:
      - '.github/workflows/packages.yml'
      - '.config/dotnet-tools.json'
      - 'eng/*release.py'
      - 'eng/check-native-update.py'
      - 'eng/check-release-validation.py'
      - 'eng/*vpk.py'
      - 'eng/build-windows-updater.py'
      - 'eng/Editor.UpdateProbe/**'
      - 'eng/velopack/**'
      - 'eng/release/**'
      - 'src/**'
      - 'Directory.*.props'

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install Linux package tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools openssl libx11-6 libice6 libsm6 libfontconfig1 xvfb
      - name: Check release validation rules
        run: python eng/check-release-validation.py
      - name: Verify repository
        run: dotnet msbuild eng/verify.proj
      - name: Build signed test-feed packages
        run: python eng/package-release.py --rid ${{ matrix.rid }}
      - name: Check native editor updates and recovery
        run: python eng/check-native-update.py --rid ${{ matrix.rid }}
      - name: Upload native update evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-update-${{ matrix.rid }}
          path: |
            artifacts/native-update/${{ matrix.rid }}/
            artifacts/native-helper/${{ matrix.rid }}/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ matrix.rid }}
          path: artifacts/release/${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 7
