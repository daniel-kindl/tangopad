name: Verify

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install Linux native test packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libx11-6 libice6 libsm6 libfontconfig1 xvfb xdotool dbus-daemon xdg-desktop-portal xdg-desktop-portal-gtk python3-pil at-spi2-core libatspi2.0-0
      - name: Verify repository
        run: dotnet msbuild eng/verify.proj
      - name: Check documentation
        if: runner.os == 'Linux'
        run: |
          python3 eng/test-check-docs.py
          python3 eng/test-review-docs.py
          python3 eng/check-docs.py
          python3 eng/test-release-notes.py
          python3 eng/release-notes.py
      - name: Check Linux native editor workflows
        if: runner.os == 'Linux'
        run: /usr/bin/python3 eng/check-native-editor.py
      - name: Audit Linux accessibility and display scaling
        if: runner.os == 'Linux'
        run: /usr/bin/python3 eng/check-native-accessibility.py
      - name: Upload native editor evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-editor-${{ matrix.os }}
          path: |
            artifacts/native-editor-*
            artifacts/native-accessibility-*
          if-no-files-found: warn
          retention-days: 7
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: error
          retention-days: 7
