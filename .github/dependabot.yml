version: 2
multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    target-branch: dev
    commit-message:
      prefix: chore(deps)
    labels: [dependencies]
updates:
  - package-ecosystem: nuget
    directory: /
    patterns: ['*']
    multi-ecosystem-group: weekly-dependencies
  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: weekly-dependencies
